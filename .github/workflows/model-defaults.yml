name: Model defaults

# Keeps the default model current without anyone remembering to check (SPEC model-defaults Part B, pilot).
# Weekly, NodeKit's registry is compared with models.lock.json; if a decision-relevant fact changed, ONE pull
# request is opened on automation/model-defaults. A human merges it. The pull_request job lints the lock against
# the registry at the commit the lock pins (data, fetched by SHA), on EVERY pull request: lint rule (b) scans the whole
# repo for raw model ids, so a path filter would let a raw id merge unlinted and then block the next weekly bump.
# This repo's own install and test commands run in a read-only job that holds no write token; the pull request is
# created by a separate job that runs none of this repo's code. No provider key, no paid call.
#
# Both `uses:` refs and `platform_sha` are the same NodeKit commit and move together in a reviewed PR.
# Needs the repo setting "Allow GitHub Actions to create and approve pull requests".

on:
  schedule:
    - cron: "23 14 * * 2"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run every check and print the proposal; push nothing, open nothing.
        type: boolean
        default: true
  pull_request:

permissions: {}

jobs:
  lint:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: HomenShum/NodeKit/.github/workflows/model-bump.yml@d6cb1037098274f6e3b36c0f1391429101665fc2
    with:
      mode: lint
      platform_sha: d6cb1037098274f6e3b36c0f1391429101665fc2

  watch:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      issues: write
    uses: HomenShum/NodeKit/.github/workflows/model-bump.yml@d6cb1037098274f6e3b36c0f1391429101665fc2
    with:
      mode: watch
      platform_sha: d6cb1037098274f6e3b36c0f1391429101665fc2
      registry_ref: main
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

  bump:
    needs: watch
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
      pull-requests: write
    uses: HomenShum/NodeKit/.github/workflows/model-bump.yml@d6cb1037098274f6e3b36c0f1391429101665fc2
    with:
      mode: bump
      platform_sha: d6cb1037098274f6e3b36c0f1391429101665fc2
      registry_ref: main
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
